{% extends "helloworld/base.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<h1>{{ form_title }}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" value="{{ book.title|default:'' }}" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" name="author" id="author" value="{{ book.author|default:'' }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="genre">Genre</label>
                <input type="text" name="genre" id="genre" value="{{ book.genre|default:'' }}" required>
            </div>
            <div class="form-group">
                <label for="total_copies">Total Copies</label>
                <input type="number" name="total_copies" id="total_copies" value="{{ book.total_copies|default:'1' }}" min="0" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'book_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
