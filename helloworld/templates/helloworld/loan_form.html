{% extends "helloworld/base.html" %}
{% block title %}Checkout Book{% endblock %}
{% block content %}
<h1>Checkout Book</h1>
<div class="card">
    <p style="margin-bottom:1rem; color:#666;">
        The Member and Book dropdowns below are <strong>dynamically populated from the database</strong>.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="member_id">Member (from database)</label>
                <select name="member_id" id="member_id" required>
                    <option value="">-- Select Member --</option>
                    {% for member in members %}
                    <option value="{{ member.id }}">{{ member.name }} ({{ member.email }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="book_id">Book (from database)</label>
                <select name="book_id" id="book_id" required>
                    <option value="">-- Select Book --</option>
                    {% for book in books %}
                    <option value="{{ book.id }}">{{ book.title }} by {{ book.author }} ({{ book.total_copies }} available)</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="checkout_date">Checkout Date</label>
                <input type="date" name="checkout_date" id="checkout_date" value="{{ today }}" required>
            </div>
            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" name="due_date" id="due_date" value="{{ due_date }}" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Checkout</button>
        <a href="{% url 'loan_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
